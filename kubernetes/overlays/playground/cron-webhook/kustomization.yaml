apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cron-webhook

resources:
  - ../../../base
  - namespace.yaml
  - service.yaml
  - ingress-webhook.yaml

images:
  - name: app
    newName: cron-webhook
    newTag: latest

patches:
  - path: deployment-patch.yaml
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: cron-webhook
      - op: replace
        path: /spec/selector/matchLabels/app
        value: cron-webhook
      - op: replace
        path: /spec/template/metadata/labels/app
        value: cron-webhook
