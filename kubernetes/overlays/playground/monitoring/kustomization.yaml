apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - crds.yaml
  - namespace.yaml

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: "65.1.1"
    releaseName: kube-prometheus-stack
    namespace: monitoring
    valuesInline:
      grafana:
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - grafana.localhost
          path: /
          pathType: Prefix
        adminPassword: admin
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      prometheus:
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - prometheus.localhost
          paths:
            - /
          pathType: Prefix
        prometheusSpec:
          # Watch ServiceMonitors in all namespaces (picks up kafka-exporter)
          serviceMonitorSelectorNilUsesHelmValues: false
          serviceMonitorSelector: {}
          serviceMonitorNamespaceSelector: {}
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

      nodeExporter:
        enabled: true
      prometheus-node-exporter:
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi

      kube-state-metrics:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

      alertmanager:
        enabled: false
  - name: prometheus-kafka-exporter
    repo: https://prometheus-community.github.io/helm-charts
    version: "2.10.0"
    releaseName: kafka-exporter
    namespace: monitoring
    valuesInline:
      kafkaServer:
        - "kafka.kafka.svc.cluster.local:9092"

      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

      prometheus:
        serviceMonitor:
          # Prometheus operator in monitoring namespace will discover this
          enabled: true
          namespace: monitoring
