apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 0
  template:
    spec:
      containers:
        - name: app
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
