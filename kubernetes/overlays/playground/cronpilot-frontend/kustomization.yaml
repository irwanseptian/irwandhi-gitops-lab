apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cronpilot-frontend

resources:
  - ../../../base
  - namespace.yaml
  - svc-cronpilot-api.yaml
  - service.yaml
  - ingress-frontend.yaml

images:
  - name: app
    newName: cronpilot-frontend
    newTag: latest

patches:
  - path: deployment-patch.yaml
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /metadata/name
        value: cronpilot-frontend
      - op: replace
        path: /spec/selector/matchLabels/app
        value: cronpilot-frontend
      - op: replace
        path: /spec/template/metadata/labels/app
        value: cronpilot-frontend
