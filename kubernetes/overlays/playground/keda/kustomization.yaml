apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keda

helmCharts:
  - name: keda
    repo: https://kedacore.github.io/charts
    version: "2.15.1"
    releaseName: keda
    namespace: keda
    valuesInline:
      resources:
        operator:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        metricServer:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
