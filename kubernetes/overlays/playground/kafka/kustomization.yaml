apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka

helmCharts:
  # v30.1.8 is the last confirmed version in the HTTP repo index.
  # v32.x was published after Bitnami migrated to OCI-only and is not
  # reachable via --repo, which is what kustomize uses under the hood.
  - name: kafka
    repo: https://charts.bitnami.com/bitnami
    version: "30.1.8"
    releaseName: kafka
    namespace: kafka
    valuesInline:
      replicaCount: 3

      # bitnamilegacy mirrors the Bitnami image layout so the chart scripts
      # work unchanged; it just lives on a different Docker Hub org.
      image:
        registry: docker.io
        repository: bitnamilegacy/kafka
        tag: 4.0.0-debian-12-r10

      kraft:
        enabled: true

      listeners:
        client:
          protocol: PLAINTEXT
        controller:
          protocol: PLAINTEXT
        interbroker:
          protocol: PLAINTEXT

      replicationFactor: 3
      offsetsTopicReplicationFactor: 3
      transactionStateLogReplicationFactor: 3
      transactionStateLogMinIsr: 2
      minInsyncReplicas: 2

      persistence:
        size: 2Gi

      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi

      provisioning:
        enabled: false
