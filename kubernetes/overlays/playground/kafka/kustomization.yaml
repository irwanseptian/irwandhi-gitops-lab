apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kafka

helmCharts:
  - name: kafka
    repo: https://charts.bitnami.com/bitnami
    version: "30.1.8"
    releaseName: kafka
    namespace: kafka
    valuesInline:
      # KRaft mode — no ZooKeeper, single broker for local k3d
      replicaCount: 1

      kraft:
        enabled: true

      listeners:
        client:
          protocol: PLAINTEXT
        controller:
          protocol: PLAINTEXT
        interbroker:
          protocol: PLAINTEXT

      persistence:
        size: 2Gi

      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi

      # Pre-create the orders topic with 6 partitions so KEDA can
      # distribute load across up to 6 consumer pods.
      provisioning:
        enabled: true
        topics:
          - name: orders
            partitions: 6
            replicationFactor: 1
            config:
              retention.ms: "3600000"
              segment.ms: "300000"
