name: irwandhi-gitops-lab

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       cronpilot
      POSTGRES_USER:     cronpilot
      POSTGRES_PASSWORD: cronpilot
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cronpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  cronpilot-api:
    build: ./apps/cronpilot-api
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     cronpilot
      DB_USER:     cronpilot
      DB_PASSWORD: cronpilot
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  cronpilot-worker:
    build: ./apps/cronpilot-worker
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     cronpilot
      DB_USER:     cronpilot
      DB_PASSWORD: cronpilot
    depends_on:
      db:
        condition: service_healthy

  cronpilot-frontend:
    build: ./apps/cronpilot-frontend
    ports:
      - "8080:80"
    depends_on:
      - cronpilot-api

  cron-webhook:
    build: ./apps/cron-webhook
    environment:
      PORT:        4000
      MAX_ENTRIES: 500
    ports:
      - "4000:4000"

volumes:
  pg_data:
