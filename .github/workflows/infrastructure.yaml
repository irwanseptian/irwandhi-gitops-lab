name: Terraform workflow

on:
  push:
    branches:
      - main
    paths:
      - "infra/terraform/environments/**"
      - "infra/terraform/stacks/**"
  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/environments/**"
      - "infra/terraform/stacks/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  discover:
    name: Discover Stacks
    runs-on: ubuntu-24.04
    outputs:
      stacks: ${{ steps.scan.outputs.stacks }}

    steps:
      - uses: actions/checkout@v4

      - name: Find all terraform stacks
        id: scan
        run: |
          stacks=$(find infra/terraform/environments -mindepth 3 -maxdepth 3 -name "terraform.tfvars" \
            | while IFS= read -r tfvars; do
                env_path=$(dirname "$tfvars")
                stack_name=$(basename "$env_path")
                env=$(basename "$(dirname "$env_path")")
                stack_path="infra/terraform/stacks/${stack_name}"
                jq -cn \
                  --arg stack "$stack_name" \
                  --arg environment "$env" \
                  --arg stack_path "$stack_path" \
                  --arg env_path "$env_path" \
                  '{"stack": $stack, "environment": $environment, "stack_path": $stack_path, "env_path": $env_path}'
              done \
            | jq -sc '.')
          echo "stacks=${stacks}" >> $GITHUB_OUTPUT
          echo "Discovered stacks: ${stacks}"

  detect-changes:
    name: Detect Changed Stacks
    runs-on: ubuntu-24.04
    needs: discover
    outputs:
      stacks: ${{ steps.filter.outputs.stacks }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter stacks with changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="HEAD~1"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Fallback for initial push
          if [ "$BASE" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE" ]; then
            echo "Initial push — marking all stacks as changed"
            echo "stacks=${{ needs.discover.outputs.stacks }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          changed='[]'
          for row in $(echo '${{ needs.discover.outputs.stacks }}' | jq -c '.[]'); do
            stack=$(echo "$row" | jq -r '.stack')
            env_path=$(echo "$row" | jq -r '.env_path')
            stack_path=$(echo "$row" | jq -r '.stack_path')

            if echo "$CHANGED_FILES" | grep -q "^${env_path}/" || \
               echo "$CHANGED_FILES" | grep -q "^${stack_path}/"; then
              changed=$(echo "$changed" | jq -c --argjson item "$row" '. + [$item]')
            fi
          done

          echo "Changed stacks: ${changed}"
          echo "stacks=${changed}" >> $GITHUB_OUTPUT

  terraform:
    name: Terraform (${{ matrix.environment }}/${{ matrix.stack }})
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.stacks != '[]' && needs.detect-changes.outputs.stacks != ''
    environment: ${{ matrix.environment }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.stacks) }}

    defaults:
      run:
        working-directory: ${{ matrix.stack_path }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_FILE: ${{ github.workspace }}/${{ matrix.env_path }}/terraform.tfvars
      TF_BACKEND_CONFIG: ${{ github.workspace }}/${{ matrix.env_path }}/backend.hcl

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend-config="${TF_BACKEND_CONFIG}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan -input=false -var-file="${TF_VAR_FILE}" 2>&1 | tee plan_output.txt
          echo "stdout<<EOF" >> $GITHUB_OUTPUT
          cat plan_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          STACK: ${{ matrix.environment }}/${{ matrix.stack }}
        with:
          script: |
            const output = process.env.PLAN_OUTPUT;
            const stack = process.env.STACK;
            const body = [
              `#### Terraform Plan - \`${stack}\``,
              '',
              '<details>',
              '<summary>Click to expand plan output</summary>',
              '',
              '```hcl',
              output,
              '```',
              '</details>',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false tfplan
